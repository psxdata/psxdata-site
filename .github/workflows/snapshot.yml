name: Market snapshot

# Refreshes public/data/snapshot.json after the PSX close (15:30 PKT = 10:30 UTC) on weekdays.
# The commit to main triggers the Cloudflare deploy, so the site shows the new numbers.
# main is protected (PRs only), and a repo ruleset can't exempt the built-in Actions token, so the
# push uses a write deploy key (secret SNAPSHOT_DEPLOY_KEY), which the "Protect main" ruleset allows.
on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SNAPSHOT_DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psxdata
        run: pip install psxdata

      - name: Build snapshot
        run: python scripts/snapshot.py

      - name: Commit if changed
        run: |
          git add public/data/snapshot.json
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update market snapshot"
          git push
